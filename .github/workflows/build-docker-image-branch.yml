name: Build and Publish Docker Image on Branch Update

on:
  issue_comment:
    types: [created]

jobs:
  build-and-publish-branch:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/build')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Get PR branch
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('branch', pr.data.head.ref);

      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.branch }}

      - name: Get the branch name
        run: echo "BRANCH_NAME=$(echo '${{ steps.pr-info.outputs.branch }}' | sed 's/[^a-zA-Z0-9._-]/-/g')" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.BRANCH_NAME }}
          cache-from: type=gha,scope=branch-build
          cache-to: type=gha,mode=min,scope=branch-build,ignore-error=true
          platforms: linux/amd64
